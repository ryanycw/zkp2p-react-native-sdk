name: Claude Code Review

on:
  issue_comment:
    types: [created]

jobs:
  claude-review:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude review')
    
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          
          # Automated review prompt for ZKP2P React Native SDK
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number }}
            
            Please review this pull request for the ZKP2P React Native SDK.
            
            This is a React Native SDK with native modules for iOS and Android, enabling ZKP2P functionality in mobile apps.
            
            Focus on:
            - React Native best practices and performance optimization
            - Native module integration (iOS Swift/Objective-C, Android Kotlin/Java)
            - TypeScript type safety and proper typing
            - Cross-platform compatibility and platform-specific code
            - Native bridge communication and data serialization
            - Gnark proof generation via native bridges
            - Memory management in native modules
            - React Native component lifecycle and hooks usage
            - Bundle size and native library integration
            - Test coverage for both JavaScript and native code
            - CocoaPods and Gradle configuration
            - React Native upgrade compatibility
            - Security considerations for cryptographic operations
            
            The project uses yarn as its package manager. Be constructive and helpful in your feedback.
            
            IMPORTANT: Post your review as a GitHub comment using `gh pr comment` or the MCP GitHub comment tools.
            Only your GitHub comments that you post will be seen, so don't submit your review as a normal message, just as comments.
            If you want to use sticky comments to update the same comment on subsequent reviews, use the MCP tool: mcp__github_comment__update_claude_comment
          
          # Use Claude Opus 4 for comprehensive code reviews with ability to post comments
          claude_args: |
            --model claude-opus-4-1-20250805
            --max-turns 10
            --allowedTools "mcp__github_comment__update_claude_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(yarn test),Bash(yarn lint),Bash(yarn build)"